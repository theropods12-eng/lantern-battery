<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#020603">
<title>Lantern Battery</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lantern Battery">
<style>
  :root {
    --green: #8cff9a;
    --green2: #24ff55;
    --deep: #031007;
    --glow: rgba(45,255,82,.55);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 43%, rgba(38,255,74,.10), transparent 28%),
      radial-gradient(circle at 50% 50%, #06120a 0%, #010301 60%, #000 100%);
  }

  #app {
    position: relative;
    width: min(100vw, 520px);
    height: 100dvh;
    min-height: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    isolation: isolate;
  }

  .scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 10;
    opacity: .08;
    background: repeating-linear-gradient(
      to bottom, transparent 0px, transparent 3px,
      rgba(150,255,160,.25) 4px
    );
    mix-blend-mode: screen;
  }

  .stars {
    position: absolute; inset: 0; opacity: .45; pointer-events: none;
    background-image:
      radial-gradient(circle, rgba(180,255,190,.65) 1px, transparent 1.5px),
      radial-gradient(circle, rgba(180,255,190,.35) 1px, transparent 1.5px);
    background-size: 97px 113px, 157px 181px;
    background-position: 11px 23px, 61px 79px;
  }

  .top {
    position: absolute;
    top: max(18px, env(safe-area-inset-top));
    left: 0; right: 0;
    text-align: center;
    letter-spacing: .26em;
    font-size: 10px;
    color: rgba(190,255,198,.72);
    text-transform: uppercase;
  }

  .title {
    font-size: clamp(18px, 5vw, 25px);
    letter-spacing: .19em;
    font-weight: 800;
    text-shadow: 0 0 15px var(--glow);
  }

  .subtitle {
    margin-top: 6px;
    font-size: 9px;
    letter-spacing: .28em;
    opacity: .55;
  }

  .battery-button {
    position: relative;
    width: min(74vw, 310px);
    aspect-ratio: 1 / 1.13;
    border: 0;
    background: transparent;
    padding: 0;
    cursor: pointer;
    flex: 0 0 auto;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    filter: drop-shadow(0 0 18px rgba(49,255,79,.25));
    transition: transform .12s ease, filter .2s ease;
  }

  .battery-button.charging {
    transform: scale(.982);
    filter: drop-shadow(0 0 42px rgba(49,255,79,.95));
  }

  .battery-button:active {
    transform: scale(.965);
    filter: drop-shadow(0 0 34px rgba(49,255,79,.8));
  }

  .halo {
    position: absolute;
    inset: 7%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(57,255,81,.18), rgba(57,255,81,.05) 42%, transparent 68%);
    animation: breathe 2.7s ease-in-out infinite;
  }

  @keyframes breathe {
    0%,100% { transform: scale(.94); opacity: .7; }
    50% { transform: scale(1.07); opacity: 1; }
  }

  /* Full-screen cylindrical Lantern Battery */
  .battery-button {
    width: min(94vw, 460px);
    height: min(80vh, 820px);
    aspect-ratio: auto;
  }

  .halo {
    inset: -5%;
    border-radius: 48%;
    background:
      radial-gradient(ellipse at center, rgba(54,255,87,.28), rgba(54,255,87,.10) 38%, transparent 70%);
    animation: breathe 2.7s ease-in-out infinite;
  }

  .battery {
    position: absolute;
    left: 8%; right: 8%; top: 3%; bottom: 3%;
    border: 0;
    border-radius: 18% 18% 12% 12% / 8% 8% 5% 5%;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(129,255,151,.20) 0 3px,
        rgba(3,46,17,.55) 3px 8px,
        rgba(95,255,116,.13) 8px 11px
      ),
      linear-gradient(90deg, #06230e 0%, #0c6b25 18%, #16a63d 42%, #087326 66%, #032b11 100%);
    box-shadow:
      inset 18px 0 28px rgba(0,0,0,.42),
      inset -16px 0 28px rgba(0,0,0,.48),
      inset 0 0 25px rgba(87,255,111,.25),
      0 0 16px rgba(65,255,94,.55),
      0 0 42px rgba(65,255,94,.18);
    border-left: 5px solid #a9863b;
    border-right: 5px solid #a9863b;
  }

  .energy-fill {
    position: absolute;
    left: 5%; right: 5%; bottom: 3%;
    height: 87%;
    transform-origin: bottom center;
    background:
      linear-gradient(to top, rgba(85,255,108,.72), rgba(72,255,95,.22) 72%, rgba(72,255,95,.04));
    box-shadow: 0 0 28px rgba(62,255,89,.38), inset 0 0 22px rgba(180,255,190,.10);
    opacity: .86;
    border-radius: 10% 10% 7% 7%;
    clip-path: inset(0 0 0 0);
    transition: clip-path .55s cubic-bezier(.2,.8,.2,1), opacity .25s ease;
    z-index: 1;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .battery.low .energy-fill { opacity: .68; }
  .battery.critical .energy-fill {
    opacity: .9;
    animation: criticalPulse .8s ease-in-out infinite;
  }
  @keyframes criticalPulse {
    0%,100% { filter: brightness(.8); }
    50% { filter: brightness(1.45); }
  }

  .battery:before {
    content: "";
    position: absolute;
    inset: 8% 3%;
    border-radius: 14%;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(200,255,208,.22) 0 2px,
        transparent 2px 9px
      );
    opacity: .8;
    mix-blend-mode: screen;
  }

  .battery:after {
    content: "";
    position: absolute;
    left: 8%; right: 8%; top: 8%; bottom: 7%;
    border-radius: 12%;
    background: linear-gradient(90deg, transparent 0 13%, rgba(190,255,202,.20) 19%, transparent 27% 72%, rgba(0,0,0,.25) 84%, transparent 91%);
    pointer-events: none;
  }

  .top-cap, .bottom-cap {
    position: absolute;
    left: -8%; right: -8%;
    height: 9%;
    border: 3px solid #b18b3e;
    background:
      linear-gradient(#302c20, #80703d 25%, #181811 47%, #9a7d38 70%, #252316);
    box-shadow:
      0 0 0 2px rgba(0,0,0,.8),
      0 0 14px rgba(78,255,99,.28);
    z-index: 4;
    clip-path: polygon(5% 0,95% 0,100% 24%,100% 78%,95% 100%,5% 100%,0 78%,0 24%);
  }
  .top-cap { top: 0; transform: translateY(-35%); }
  .bottom-cap { bottom: 0; transform: translateY(35%); }

  .top-cap:after {
    content: "";
    position: absolute;
    left: 31%; right: 31%; top: -35%;
    height: 55%;
    border-radius: 45%;
    background: linear-gradient(#b99850, #544b2c 55%, #a78542);
    box-shadow: 0 -2px 8px rgba(0,0,0,.8);
  }

  .emblem-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 31%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border: 7px double #c09a4b;
    border-radius: 50%;
    background:
      radial-gradient(circle, #0b3d18 0 43%, #166d2b 44% 56%, #08250f 57% 62%, #aa853c 63% 67%, #2b2718 68% 100%);
    box-shadow:
      0 0 0 2px rgba(0,0,0,.7),
      0 0 17px rgba(58,255,82,.5),
      inset 0 0 12px rgba(80,255,102,.25);
    display: grid;
    place-items: center;
    z-index: 5;
  }

  .emblem {
    width: 44%; height: 38%;
    position: relative;
    background: #b89446;
    filter: drop-shadow(0 0 5px rgba(105,255,121,.7));
    clip-path: polygon(
      0 18%, 34% 18%, 34% 0, 66% 0, 66% 18%, 100% 18%,
      100% 82%, 66% 82%, 66% 100%, 34% 100%, 34% 82%, 0 82%
    );
  }

  .emblem:after {
    content: "";
    position: absolute;
    inset: 19%;
    background: #06220d;
    clip-path: inherit;
  }

  .core {
    position: absolute;
    left: 25%; right: 25%; top: 20%;
    height: 60%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(111,255,128,.18), transparent 65%);
    box-shadow: 0 0 30px 12px rgba(70,255,91,.18);
    animation: corepulse 1.8s ease-in-out infinite;
    z-index: 1;
  }

  @keyframes breathe {
    0%,100% { transform: scale(.95); opacity: .72; }
    50% { transform: scale(1.06); opacity: 1; }
  }

  .battery-button.charging .halo {
    animation: chargeHalo .65s ease-in-out infinite;
  }

  .battery-button.charging .core {
    animation: chargeCore .45s ease-in-out infinite;
    filter: brightness(1.35);
  }

  .battery-button.charging .battery {
    box-shadow:
      inset 18px 0 28px rgba(0,0,0,.42),
      inset -16px 0 28px rgba(0,0,0,.48),
      inset 0 0 34px rgba(87,255,111,.42),
      0 0 24px rgba(65,255,94,.78),
      0 0 70px rgba(65,255,94,.38);
  }

  .battery-button.charging .emblem-ring {
    animation: emblemCharge .7s ease-in-out infinite;
  }

  .battery-button.charged .battery {
    animation: fullPower 1.15s ease-out 1;
  }

  @keyframes chargeHalo {
    0%,100% { transform: scale(.96); opacity: .7; }
    50% { transform: scale(1.12); opacity: 1; }
  }

  @keyframes chargeCore {
    0%,100% { transform: scale(.96); opacity: .75; }
    50% { transform: scale(1.13); opacity: 1; }
  }

  @keyframes emblemCharge {
    0%,100% { filter: brightness(1); }
    50% { filter: brightness(1.8) drop-shadow(0 0 13px rgba(115,255,135,.95)); }
  }

  @keyframes fullPower {
    0% { filter: brightness(1); }
    18% { filter: brightness(2.6); }
    35% { filter: brightness(1.1); }
    52% { filter: brightness(2.15); }
    100% { filter: brightness(1); }
  }

  .charging-pulse {
    position: absolute;
    left: 50%; top: 50%;
    width: 12%; aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid rgba(150,255,165,.85);
    box-shadow: 0 0 20px rgba(90,255,110,.9);
    transform: translate(-50%,-50%) scale(.3);
    opacity: 0;
    pointer-events: none;
    z-index: 15;
  }

  .battery-button.charging .charging-pulse {
    animation: chargePulse 1.15s ease-out infinite;
  }

  @keyframes chargePulse {
    0% { transform: translate(-50%,-50%) scale(.35); opacity: .85; }
    100% { transform: translate(-50%,-50%) scale(4.2); opacity: 0; }
  }

  .readout {
    position: absolute;
    bottom: max(52px, env(safe-area-inset-bottom));
    left: 0; right: 0;
    text-align: center;
  }

  .label {
    font-size: 9px;
    letter-spacing: .32em;
    color: rgba(190,255,198,.55);
    margin-bottom: 8px;
  }

  #percent {
    font-size: clamp(46px, 14vw, 70px);
    font-weight: 800;
    letter-spacing: -.03em;
    line-height: .9;
    text-shadow: 0 0 12px var(--green), 0 0 35px rgba(49,255,79,.45);
  }

  #status {
    margin-top: 10px;
    font-size: 9px;
    letter-spacing: .25em;
    opacity: .62;
    text-transform: uppercase;
  }

  #tapHint {
    margin-top: 18px;
    font-size: 9px;
    letter-spacing: .18em;
    opacity: .38;
    text-transform: uppercase;
  }

  .flash {
    position: absolute; inset: 0; z-index: 20; pointer-events: none;
    background: rgba(120,255,140,.75);
    opacity: 0;
  }

  .flash.go { animation: flash .42s ease-out; }
  @keyframes flash {
    0% { opacity: 0; }
    15% { opacity: .8; }
    100% { opacity: 0; }
  }

  .corner {
    position: absolute;
    width: 25px; height: 25px;
    border-color: rgba(130,255,145,.45);
    pointer-events: none;
  }
  .tl { top: 18px; left: 18px; border-top: 1px solid; border-left: 1px solid; }
  .tr { top: 18px; right: 18px; border-top: 1px solid; border-right: 1px solid; }
  .bl { bottom: 18px; left: 18px; border-bottom: 1px solid; border-left: 1px solid; }
  .br { bottom: 18px; right: 18px; border-bottom: 1px solid; border-right: 1px solid; }

  .unsupported {
    position: absolute;
    top: 92px;
    left: 18px; right: 18px;
    text-align: center;
    font-size: 8px;
    letter-spacing: .12em;
    color: rgba(255,255,255,.35);
    display: none;
  }

  @media (max-height: 650px) {
    .battery-button { width: 94vw; height: 72vh; }
    .readout { bottom: 18px; }
    .top { top: 12px; }
    .title { font-size: 17px; }
    .subtitle { font-size: 8px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="stars"></div>
  <div class="scanlines"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div class="top">
    <div class="title">GREEN LANTERN</div>
    <div class="subtitle">POWER BATTERY // RING LINK</div>
  </div>

  <button class="battery-button" id="batteryButton" aria-label="Activate Lantern Battery">
    <div class="halo"></div>
    <div class="charging-pulse"></div>
    <div class="battery">
      <div class="energy-fill" id="energyFill"></div>
      <div class="top-cap"></div>
      <div class="bottom-cap"></div>
      <div class="emblem-ring"><div class="emblem"></div></div>
      <div class="core"></div>
    </div>
  </button>

  <div class="readout">
    <div class="label">RING POWER RESERVE</div>
    <div id="percent">--%</div>
    <div id="status">TAP BATTERY TO CHECK</div>
    <div id="tapHint">TAP TO CHECK // HOLD TO CHARGE</div>
  </div>

  <div class="unsupported" id="unsupported">
    DEVICE BATTERY ACCESS UNAVAILABLE — DEMO MODE ENABLED
  </div>
  <div class="flash" id="flash"></div>
</div>

<script>
let batteryLevel = 87;
let hasNativeBattery = false;
let isCharging = false;

const percentEl = document.getElementById("percent");
const statusEl = document.getElementById("status");
const hintEl = document.getElementById("tapHint");
const unsupportedEl = document.getElementById("unsupported");
const flashEl = document.getElementById("flash");
const button = document.getElementById("batteryButton");
const energyFill = document.getElementById("energyFill");
const batteryVisual = document.querySelector(".battery");

function setPercent(value) {
  batteryLevel = Math.max(0, Math.min(100, Math.round(value)));
  percentEl.textContent = batteryLevel + "%";

  // Visually fill the Lantern Battery according to the phone's charge.
  const empty = 100 - batteryLevel;
  energyFill.style.clipPath = `inset(${empty}% 0 0 0)`;

  batteryVisual.classList.toggle("low", batteryLevel <= 25);
  batteryVisual.classList.toggle("critical", batteryLevel <= 10);

  if (batteryLevel <= 10) statusEl.textContent = "CRITICAL POWER RESERVE";
  else if (batteryLevel <= 25) statusEl.textContent = "LOW POWER RESERVE";
  else if (batteryLevel <= 50) statusEl.textContent = "POWER RESERVE NOMINAL";
  else statusEl.textContent = "POWER RESERVE OPTIMAL";
}

function numberToWords(n) {
  const ones = ["zero","one","two","three","four","five","six","seven","eight","nine",
                "ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen",
                "seventeen","eighteen","nineteen"];
  const tens = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
  if (n < 20) return ones[n];
  if (n < 100) return tens[Math.floor(n/10)] + (n%10 ? "-" + ones[n%10] : "");
  return ones[Math.floor(n/100)] + (n%100 ? " " + numberToWords(n%100) : "");
}

// The uploaded reference clip contains the original "Ring charge, five percent"
// announcement. The exact clip is used when the phone is at 5%. For other
// percentages, Safari falls back to its built-in speech voice with tuned cadence.
const referenceAudio = new Audio();
referenceAudio.preload = "auto";
// The 5% voice reference is embedded below by the generator.

// Charging sound: a short ramping-up/ramping-down effect, extended into a
// longer loop so it can continue naturally while the user holds the ring.
const chargingAudio = new Audio();
chargingAudio.preload = "auto";
chargingAudio.loop = true;
chargingAudio.volume = 0.82;

let charging = false;
let chargeTimer = null;
let chargeStartedAt = 0;
let chargeStartLevel = 0;
let suppressClickUntil = 0;
const HOLD_DELAY = 430;
const CHARGE_RATE_PER_SEC = 12;
let chargeTimeMs = 5600;

function speakPower() {
  // Exact reference line for 5%.
  if (batteryLevel === 5 && referenceAudio.src) {
    try {
      referenceAudio.currentTime = 0;
      referenceAudio.play().catch(() => {});
      return;
    } catch(e) {}
  }

  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const text = `Ring charge, ${numberToWords(batteryLevel)} percent.`;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 0.80;
  utterance.pitch = 1.05;
  utterance.volume = 1;

  const voices = window.speechSynthesis.getVoices();
  const preferred =
    voices.find(v => /^en-US$/i.test(v.lang) && /Samantha|Karen|Daniel|Alex/i.test(v.name)) ||
    voices.find(v => /^en-US$/i.test(v.lang)) ||
    voices.find(v => /^en/i.test(v.lang));

  if (preferred) utterance.voice = preferred;
  window.speechSynthesis.speak(utterance);
}

function flashScreen(strength = 0.75) {
  flashEl.classList.remove("go");
  flashEl.style.background = `rgba(120,255,140,${strength})`;
  void flashEl.offsetWidth;
  flashEl.classList.add("go");
  setTimeout(() => { flashEl.style.background = "rgba(120,255,140,.75)"; }, 500);
}

function activate() {
  flashScreen(.75);
  statusEl.textContent = "RING LINK VERIFIED";

  energyFill.style.filter = "brightness(1.8)";
  setTimeout(() => { if (!charging) energyFill.style.filter = ""; }, 420);

  speakPower();

  setTimeout(() => {
    if (charging) statusEl.textContent = "POWER CELL RECHARGING";
    else if (batteryLevel <= 10) statusEl.textContent = "CRITICAL POWER RESERVE";
    else if (batteryLevel <= 25) statusEl.textContent = "LOW POWER RESERVE";
    else if (batteryLevel <= 50) statusEl.textContent = "POWER RESERVE NOMINAL";
    else statusEl.textContent = "POWER RESERVE OPTIMAL";
  }, 2200);
}

function updateChargeProgress() {
  if (!charging) return;

  const elapsed = performance.now() - chargeStartedAt;
  const progress = Math.min(1, elapsed / chargeTimeMs);
  const nextLevel = chargeStartLevel + (100 - chargeStartLevel) * progress;
  setPercent(nextLevel);
  statusEl.textContent = progress >= 1 ? "POWER CELL FULL // 100%" : "POWER CELL RECHARGING";

  if (progress >= 1) {
    finishCharging();
    return;
  }
  chargeTimer = requestAnimationFrame(updateChargeProgress);
}

function startCharging() {
  if (charging) return;

  // If already at full, still give the user a satisfying full-power response.
  if (batteryLevel >= 100) {
    flashScreen(0.95);
    batteryVisual.classList.add("charged");
    setTimeout(() => batteryVisual.classList.remove("charged"), 1200);
    statusEl.textContent = "POWER CELL FULL // 100%";
    return;
  }

  charging = true;
  isCharging = true;
  chargeStartLevel = batteryLevel;
  chargeTimeMs = Math.max(900, ((100 - chargeStartLevel) / CHARGE_RATE_PER_SEC) * 1000);
  chargeStartedAt = performance.now();
  button.classList.add("charging");
  hintEl.textContent = "RELEASE TO STOP CHARGING";
  statusEl.textContent = "POWER CELL RECHARGING";

  try {
    chargingAudio.currentTime = 0;
    chargingAudio.play().catch(() => {});
  } catch(e) {}

  chargeTimer = requestAnimationFrame(updateChargeProgress);
}

function stopCharging() {
  if (!charging) return;
  charging = false;
  isCharging = false;
  if (chargeTimer) cancelAnimationFrame(chargeTimer);
  chargeTimer = null;
  button.classList.remove("charging");
  hintEl.textContent = "TAP TO CHECK // HOLD TO CHARGE";

  // Fade the charging sound instead of cutting it off abruptly.
  const fadeFrom = chargingAudio.volume;
  const fadeStart = performance.now();
  const fadeDuration = 220;
  function fadeOut(now) {
    const p = Math.min(1, (now - fadeStart) / fadeDuration);
    chargingAudio.volume = fadeFrom * (1 - p);
    if (p < 1) requestAnimationFrame(fadeOut);
    else {
      chargingAudio.pause();
      chargingAudio.currentTime = 0;
      chargingAudio.volume = 0.82;
    }
  }
  requestAnimationFrame(fadeOut);

  if (batteryLevel < 100) {
    if (batteryLevel <= 10) statusEl.textContent = "CRITICAL POWER RESERVE";
    else if (batteryLevel <= 25) statusEl.textContent = "LOW POWER RESERVE";
    else if (batteryLevel <= 50) statusEl.textContent = "POWER RESERVE NOMINAL";
    else statusEl.textContent = "POWER RESERVE OPTIMAL";
  }
}

function finishCharging() {
  charging = false;
  isCharging = false;
  if (chargeTimer) cancelAnimationFrame(chargeTimer);
  chargeTimer = null;
  setPercent(100);
  button.classList.remove("charging");
  button.classList.add("charged");
  hintEl.textContent = "POWER CELL FULL // TAP TO CHECK";
  statusEl.textContent = "POWER CELL FULL // 100%";
  flashScreen(.95);

  // Let the charging effect ring out briefly at full power.
  const fadeFrom = chargingAudio.volume;
  const fadeStart = performance.now();
  const fadeDuration = 650;
  function fadeOut(now) {
    const p = Math.min(1, (now - fadeStart) / fadeDuration);
    chargingAudio.volume = fadeFrom * (1 - p);
    if (p < 1) requestAnimationFrame(fadeOut);
    else {
      chargingAudio.pause();
      chargingAudio.currentTime = 0;
      chargingAudio.volume = 0.82;
    }
  }
  requestAnimationFrame(fadeOut);

  setTimeout(() => button.classList.remove("charged"), 1200);
}

let holdTimer = null;
let pointerIsDown = false;
let holdTriggered = false;

function pressStart(e) {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  e.preventDefault();
  pointerIsDown = true;
  holdTriggered = false;
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => {
    if (pointerIsDown) {
      holdTriggered = true;
      startCharging();
    }
  }, HOLD_DELAY);
}

function pressEnd(e) {
  if (!pointerIsDown) return;
  e.preventDefault();
  pointerIsDown = false;
  clearTimeout(holdTimer);
  holdTimer = null;
  suppressClickUntil = Date.now() + 600;

  if (holdTriggered) {
    stopCharging();
  } else {
    activate();
  }
  holdTriggered = false;
}

button.addEventListener("pointerdown", pressStart, {passive:false});
button.addEventListener("pointerup", pressEnd, {passive:false});
button.addEventListener("pointercancel", pressEnd, {passive:false});
button.addEventListener("click", e => {
  if (Date.now() < suppressClickUntil) {
    e.preventDefault();
    return;
  }
  activate();
});

async function getBattery() {
  try {
    if ("getBattery" in navigator) {
      const b = await navigator.getBattery();
      hasNativeBattery = true;
      setPercent(b.level * 100);
      isCharging = !!b.charging;

      b.addEventListener("levelchange", () => setPercent(b.level * 100));
      b.addEventListener("chargingchange", () => {
        isCharging = !!b.charging;
        if (isCharging) statusEl.textContent = "POWER CELL RECHARGING";
      });
      return;
    }
  } catch(e) {}

  unsupportedEl.style.display = "block";
}

// URL sync mode: the Apple Shortcut can open
// .../lantern-battery/?battery=59&charging=true
// and the webpage will immediately use those values.
const params = new URLSearchParams(location.search);

if (params.has("battery")) {
  const supplied = Number(params.get("battery"));
  if (Number.isFinite(supplied)) setPercent(supplied);
}

if (params.get("charging") === "true") {
  isCharging = true;
  statusEl.textContent = "POWER CELL RECHARGING";
}

// Only try the native API when the Shortcut did not supply a value.
if (!params.has("battery")) getBattery();
else unsupportedEl.style.display = "none";
